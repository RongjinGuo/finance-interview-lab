<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#24483f">
  <meta name="description" content="为财务管理专业求职者准备的模拟面试练习室：五大岗位、专业题库、逐题练习与面试复盘。">
  <title>财务面试练习室 · 面试前，再练一次</title>
  <style>
@charset "UTF-8";

:root {
  --paper: #f5f3ec;
  --card: #fffefa;
  --ink: #233f37;
  --muted: #70786d;
  --line: #dedfd3;
  --green: #24483f;

  --orange: #b5502d;

}
* { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.7; }
body::before { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: -1; opacity: .38; background: radial-gradient(ellipse at 80% 0%, #e5e9d4 0, transparent 42%), repeating-linear-gradient(0deg, transparent 0, transparent 3px, #ddd9cc20 4px); }
button, input, select, textarea { font: inherit; }
button, a, input, select, textarea { -webkit-tap-highlight-color: transparent; }
button { cursor: pointer; }
button { color: inherit; }
button:disabled { cursor: not-allowed; opacity: .45; }
button, a, input, select, textarea, summary { outline-offset: 5px; }
:focus-visible { outline: 2px solid var(--orange); }
h1:focus, .question-title:focus { outline: none; }
a { color: inherit; }
h1, h2, h3, h4, p { margin-top: 0; }
h1, h2, h3 { line-height: 1.35; }
p { margin-bottom: 12px; }
button { border: none; }
.layout { min-height: 100vh; display: grid; grid-template-columns: 226px minmax(0, 1fr); }
.sidebar { background: #eeeee4d9; border-right: 1px solid var(--line); padding: 34px 23px 24px; position: sticky; top: 0; height: 100vh; display: flex; flex-direction: column; }
.brand { display: flex; gap: 10px; align-items: center; text-decoration: none; margin-bottom: 50px; }
.brand-mark { width: 36px; height: 39px; background: var(--green); border-radius: 9px 9px 2px 9px; color: #e2e9c6; display: grid; place-items: center; }
.brand-name { font-weight: 650; font-size: 15px; letter-spacing: .5px; }
.brand-sub { display: block; font-size: 8px; letter-spacing: 1.2px; margin-top: 1px; color: var(--muted); white-space: nowrap; }
.nav-caption, .eyebrow { color: var(--muted); font-size: 10px; font-weight: 600; letter-spacing: 2px; }
.nav-caption { padding-left: 12px; margin-bottom: 12px; }
.nav { display: grid; gap: 7px; }
.nav button { background: transparent; width: 100%; display: flex; align-items: center; gap: 11px; text-align: left; padding: 12px; color: #6a7469; border-radius: 6px; }
.nav button.active { background: #dee5d5; color: var(--ink); font-weight: 600; }

.hero-desc { color: var(--muted); font-size: 13px; line-height: 1.95; }

.art-bars i { width: 15px; background: #adbca0; border-radius: 2px 2px 0 0; }
.art-bars i:last-child { background: var(--green); }
.art-check { position: absolute; right: 30px; bottom: 21px; z-index: 2; width: 43px; height: 43px; border-radius: 50%; background: #dce7c7; border: 5px solid var(--paper); display: grid; place-items: center; color: var(--green); }

.role-card:hover { transform: translateY(-3px); border-color: #899c7e; }

.selected .role-icon { color: var(--green); background: #dae4cc; }
.role-card strong { display: block; font-size: 13px; margin-bottom: 3px; }

.setup-grid { display: grid; grid-template-columns: minmax(0,1fr) 280px; gap: 21px; align-items: stretch; }
.panel { background: var(--card); border: 1px solid var(--line); border-radius: 9px; }

.quantity-row { display: flex; align-items: center; gap: 10px; border-top: 1px solid #ebece1; padding-top: 17px; margin-top: 20px; }
.quantity-label { font-size: 12px; margin-right: auto; }
.quantity { display: flex; gap: 4px; background: #f3f3ec; border-radius: 5px; padding: 3px; }
.quantity button { padding: 4px 13px; border-radius: 3px; background: transparent; font-size: 12px; }
.quantity .selected { background: #fffefa; box-shadow: 0 1px 3px #243c3320; }
.time-estimate { font-size: 10px; color: var(--muted); min-width: 68px; }
.start-row { display: flex; align-items: center; gap: 18px; margin-top: 22px; }
.button { display: inline-flex; align-items: center; justify-content: center; gap: 9px; background: var(--green); color: #fffef6; border: 1px solid var(--green); border-radius: 5px; padding: 11px 22px; font-size: 12px; font-weight: 500; text-decoration: none; transition: background .18s, transform .18s; }
.button:hover { background: #31594b; transform: translateY(-1px); }
.button.secondary { background: transparent; color: var(--green); border-color: #bdc7b5; }
.button.secondary:hover { background: #edf0e5; }
.button.small { padding: 7px 13px; font-size: 11px; }
.button.danger { border-color: #d6aa98; color: #99482c; }
.link-button { background: transparent; padding: 4px 0; color: var(--muted); font-size: 11px; display: inline-flex; align-items: center; gap: 5px; }
.link-button:hover { color: var(--green); }
.start-note { font-size: 10px; color: var(--muted); }
.tip-card { background: #ebefdf; border: 1px solid #d8dfc7; border-radius: 9px; padding: 23px; display: flex; flex-direction: column; position: relative; overflow: hidden; }

.bottom-strip { display: grid; grid-template-columns: repeat(3,1fr); gap: 20px; margin-top: 31px; border-top: 1px solid var(--line); padding-top: 22px; }

.resume-banner div { flex: 1; }
.page-title { font: 600 32px/1.4 var(--serif); margin: 0 0 8px; }

.question-meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 20px; }
.badge { font-size: 10px; display: inline-flex; align-items: center; gap: 5px; background: #ebefe2; color: #566d4e; padding: 3px 8px; border-radius: 4px; }
.badge.orange { background: var(--orange-soft); color: var(--orange); }
.question-title { font-family: var(--serif); font-size: 25px; line-height: 1.6; font-weight: 600; margin-bottom: 13px; }
.question-prompt { white-space: pre-line; font-size: 14px; line-height: 1.95; margin-bottom: 23px; }
.question-tools { display: flex; gap: 16px; padding: 0 0 20px; border-bottom: 1px solid #e8eade; margin-bottom: 20px; }
.answer-label { font-size: 12px; font-weight: 500; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
.answer-label small { color: var(--muted); font-weight: normal; font-size: 10px; }
textarea { width: 100%; background: #fbfbf6; border: 1px solid #dce1d2; border-radius: 6px; padding: 15px; resize: vertical; min-height: 213px; font-size: 13px; color: var(--ink); line-height: 1.9; }

.answer-bottom { display: flex; justify-content: space-between; color: var(--muted); font-size: 10px; margin-top: 5px; }
.action-row { display: flex; justify-content: space-between; gap: 14px; align-items: center; margin-top: 24px; flex-wrap: wrap; }
.action-group { display: flex; gap: 10px; flex-wrap: wrap; }
.timer-panel { padding: 22px; margin-bottom: 16px; }
.timer { font: 40px/1.1 Georgia, serif; letter-spacing: 1px; margin: 13px 0; }
.timer.over { color: var(--orange); }
.muted { color: var(--muted); }
.small-text { font-size: 11px; }
.progress-track { height: 4px; background: #dfe5d5; border-radius: 4px; overflow: hidden; margin: 14px 0 19px; }

.question-path { padding: 18px; }

.path-item { display: flex; gap: 9px; padding: 8px 0; font-size: 10px; color: var(--muted); }
.path-item.current { color: var(--ink); font-weight: 550; }
.path-item .path-index { flex-shrink: 0; width: 19px; height: 19px; border: 1px solid #d6dccf; border-radius: 50%; display: grid; place-items: center; font: 10px Georgia,serif; }
.path-item.current .path-index { background: var(--green); border-color: var(--green); color: white; }
.path-item.done .path-index { color: #597d43; background: #e2ebd7; border-color: #e2ebd7; }

.soft-note { background: #f1f3e9; border-radius: 6px; padding: 14px 16px; font-size: 11px; color: #6b785f; line-height: 1.9; }

.sample { font-size: 12px; white-space: pre-line; line-height: 1.95; color: #526047; }
.own-answer { background: #f6f5ee; padding: 14px; border-left: 2px solid #b9c5a7; white-space: pre-wrap; font-size: 12px; overflow-wrap: anywhere; max-height: 270px; overflow: auto; }

details { margin-top: 15px; }

.report-intro { display: grid; grid-template-columns: 1fr auto; gap: 20px; align-items: center; margin-bottom: 26px; padding: 26px 30px; background: #e5ecd9; border: 1px solid #cfdcbf; border-radius: 8px; }

.stat { padding: 19px 22px; }

.stat span { font-size: 10px; color: var(--muted); }

.report-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 24px; }

(function (root, factory) {
  if (typeof module === 'object' && module.exports) {
    module.exports = factory();
  } else {
    root.FinanceEngine = factory();
  }
})(typeof globalThis !== 'undefined' ? globalThis : this, function () {
  'use strict';

  const ROLE_IDS = ['accounting', 'analysis', 'budget', 'treasury', 'audit'];
  const STAGES = ['opening', 'professional', 'scenario', 'closing'];
  const STAGE_NAMES = { opening: '开场', professional: '专业', scenario: '情景', closing: '反问' };
  const SESSION_KEYS = ['id', 'role', 'mode', 'questionIds', 'current', 'phase', 'answers', 'createdAt', 'finishedAt'];
  const ANSWER_KEYS = ['text', 'seconds', 'skipped', 'checked', 'reviewed'];
  const hasOwn = (object, key) => Object.prototype.hasOwnProperty.call(object, key);

  function shuffle(items, rng) {
    const result = items.slice();
    for (let index = result.length - 1; index > 0; index -= 1) {
      const draw = rng();
      const normalized = Number.isFinite(draw) ? Math.max(0, Math.min(0.9999999999999999, draw)) : 0;
      const other = Math.floor(normalized * (index + 1));
      [result[index], result[other]] = [result[other], result[index]];
    }
    return result;
  }

  function compatible(question, role) {
    return question && Array.isArray(question.roles) &&
      (question.roles.includes('all') || question.roles.includes(role));
  }

  function buildSession(bank, options, rng = Math.random) {
    if (!Array.isArray(bank) || !options || !ROLE_IDS.includes(options.role)) return [];
    const seen = new Set();
    const available = bank.filter((question) => {
      if (!compatible(question, options.role) || !STAGES.includes(question.stage) ||
          typeof question.id !== 'string' || seen.has(question.id)) return false;
      seen.add(question.id);
      return true;
    });
    const requested = Number.isFinite(options.count) ? Math.floor(options.count) : 6;
    const count = Math.min(available.length, Math.max(1, requested));
    if (!count) return [];
    const random = typeof rng === 'function' ? rng : Math.random;
    const groups = Object.fromEntries(STAGES.map((stage) => [
      stage, shuffle(available.filter((question) => question.stage === stage), random)
    ]));
    const selected = [];
    if (groups.opening.length) selected.push(groups.opening.pop());
    if (selected.length < count && groups.closing.length) selected.push(groups.closing.pop());

    let professionals = 0;
    let scenarios = 0;
    while (selected.length < count && (groups.professional.length || groups.scenario.length)) {
      if (groups.professional.length && (!groups.scenario.length || professionals <= scenarios)) {
        selected.push(groups.professional.pop());
        professionals += 1;
      } else {
        selected.push(groups.scenario.pop());
        scenarios += 1;
      }
    }

    // Tiny banks can need additional opening or closing questions to fill a session.
    if (selected.length < count) {
      selected.push(...shuffle([...groups.opening, ...groups.closing], random).slice(0, count - selected.length));
    }
    return selected.sort((left, right) => STAGES.indexOf(left.stage) - STAGES.indexOf(right.stage));
  }

  function selectedQuestions(session, bank) {
    const byId = new Map(bank.map((question) => [question.id, question]));
    return session.questionIds.map((id) => byId.get(id)).filter(Boolean);
  }

  function summarize(session, bank) {
    const questions = selectedQuestions(session, bank);
    const result = {
      answered: 0, skipped: 0, reviewed: 0, total: questions.length,
      mastered: 0, pointsTotal: 0, coverage: null, categories: [], weakPoints: []
    };
    const categories = new Map();
    for (const question of questions) {
      if (!categories.has(question.category)) {
        categories.set(question.category, { name: question.category, mastered: 0, total: 0, reviewed: 0 });
      }
      const entry = session.answers && hasOwn(session.answers, question.id) ? session.answers[question.id] : null;
      if (!entry) continue;
      if (entry.skipped === true) {
        result.skipped += 1;
        continue;
      }
      if (typeof entry.text === 'string' && entry.text.trim()) result.answered += 1;
      if (entry.reviewed !== true) continue;

      const category = categories.get(question.category);
      const checked = Array.isArray(entry.checked) ? entry.checked : [];
      result.reviewed += 1;
      result.pointsTotal += question.points.length;
      category.reviewed += 1;
      category.total += question.points.length;
      question.points.forEach((point, index) => {
        if (checked[index] === true) {
          result.mastered += 1;
          category.mastered += 1;
        } else if (checked[index] === false) {
          result.weakPoints.push({
            questionId: question.id, title: question.title, label: point.label, detail: point.detail
          });
        }
      });
    }
    result.categories = Array.from(categories.values());
    if (result.pointsTotal) result.coverage = Math.round(result.mastered / result.pointsTotal * 100);
    return result;
  }

  function isPlainObject(value) {
    if (!value || typeof value !== 'object' || Array.isArray(value)) return false;
    const prototype = Object.getPrototypeOf(value);
    return prototype === Object.prototype || prototype === null;
  }

  function hasExactKeys(value, keys) {
    return Object.keys(value).length === keys.length && keys.every((key) => hasOwn(value, key));
  }

  function isIsoDate(value) {
    if (typeof value !== 'string' || value.length > 30) return false;
    const milliseconds = Date.parse(value);
    return Number.isFinite(milliseconds) && new Date(milliseconds).toISOString() === value;
  }

  function validateSession(value, bank) {
    try {
      if (!isPlainObject(value) || !hasExactKeys(value, SESSION_KEYS) || !Array.isArray(bank)) return false;
      if (typeof value.id !== 'string' || !/^[a-zA-Z0-9_-]{1,200}$/.test(value.id)) return false;
      if (!ROLE_IDS.includes(value.role) || !['practice', 'mock'].includes(value.mode) ||
          !['answer', 'review', 'finished'].includes(value.phase)) return false;
      if (!Array.isArray(value.questionIds) || !value.questionIds.length || value.questionIds.length > bank.length) return false;
      const byId = new Map(bank.map((question) => [question.id, question]));
      const questionIds = new Set();
      for (const id of value.questionIds) {
        if (typeof id !== 'string' || questionIds.has(id) || !byId.has(id) || !compatible(byId.get(id), value.role)) return false;
        questionIds.add(id);
      }
      if (!Number.isInteger(value.current) || value.current < 0 || value.current >= value.questionIds.length) return false;
      if (!isIsoDate(value.createdAt)) return false;
      if (value.phase === 'finished') {
        if (!isIsoDate(value.finishedAt) || Date.parse(value.finishedAt) < Date.parse(value.createdAt)) return false;
      } else if (value.finishedAt !== null) return false;
      if (!isPlainObject(value.answers)) return false;

        if (!questionIds.has(id) || !isPlainObject(entry) || !hasExactKeys(entry, ANSWER_KEYS)) return false;
        if (typeof entry.text !== 'string' || entry.text.length > 20000) return false;
        if (typeof entry.seconds !== 'number' || !Number.isFinite(entry.seconds) || entry.seconds < 0 || entry.seconds > 604800) return false;
        if (typeof entry.skipped !== 'boolean' || typeof entry.reviewed !== 'boolean') return false;
        if (!Array.isArray(entry.checked) || entry.checked.length !== byId.get(id).points.length ||

      }
      return true;
    } catch (_) {
      return false;
    }
  }

  function formatDuration(seconds) {
    const rounded = Math.max(0, Math.round(seconds));
    return `${Math.floor(rounded / 60)} 分 ${rounded % 60} 秒`;
  }

  function exportReport(session, bank, roles) {
    const questions = selectedQuestions(session, bank);
    const summary = summarize(session, bank);
    const role = Array.isArray(roles) ? roles.find((item) => item.id === session.role) : null;
    const seconds = questions.reduce((sum, question) => {
      const entry = session.answers[question.id];
      return sum + (entry && Number.isFinite(entry.seconds) ? entry.seconds : 0);
    }, 0);
    const coverage = summary.coverage === null ? '尚未自评' : `${summary.coverage}%（${summary.mastered}/${summary.pointsTotal} 项）`;
    const lines = [
      '# 财务面试复盘', '',
      `岗位：${role ? role.name : session.role}`,
      `模式：${session.mode === 'mock' ? '模拟面试' : '逐题练习'}`,
      `开始时间：${session.createdAt}`,
      `完成时间：${session.finishedAt || '尚未结束'}`,
      `作答用时：${formatDuration(seconds)}`,
      `题目记录：共 ${summary.total} 题；已作答 ${summary.answered} 题；已跳过 ${summary.skipped} 题；已自评 ${summary.reviewed} 题。`,
      `人工自评要点覆盖率：${coverage}`,
      '覆盖率仅统计已自评且未跳过的题目，表示你勾选的要点比例。', ''
    ];
    questions.forEach((question, index) => {
      const entry = session.answers[question.id] || {};
      const skipped = entry.skipped === true;
      const reviewed = entry.reviewed === true && !skipped;
      const answerText = typeof entry.text === 'string' && entry.text.trim() ? entry.text : '未作答';
      const state = skipped ? '已跳过（未计入自评覆盖率）' : reviewed ? '已完成人工自评' : '尚未自评（未计入自评覆盖率）';
      lines.push(
        `## ${index + 1}. ${question.title}`, '',
        `阶段：${STAGE_NAMES[question.stage] || question.stage} · 类别：${question.category} · 难度：${question.difficulty}`,
        `状态：${state}`,
        `建议用时：${question.minutes} 分钟；实际用时：${formatDuration(Number.isFinite(entry.seconds) ? entry.seconds : 0)}`, '',
        '### 面试题目', question.prompt, '',
        '### 我的回答', answerText, '',
        '### 参考思路', question.sample, '',
        '### 人工自评要点'
      );
      question.points.forEach((point, pointIndex) => {
        const mark = skipped ? '已跳过' : !reviewed ? '尚未自评' : entry.checked[pointIndex] === true ? '已勾选' : '待加强';
        lines.push(`- ${point.label}（${mark}）：${point.detail}`);
      });
      lines.push('', '### 面试官追问', question.followUp, '', '### 常见误区', question.pitfall, '');
    });
    return lines.join('\n');
  }

  function answerHints(answer) {
    const text = typeof answer === 'string' ? answer.trim() : '';
    if (!text) return ['还没有作答。先用一句话直接回答题目，再补充依据或例子。'];
    const hints = [];
    if (text.length < 80) hints.push('回答比较简短，可以补充一个具体情境，以及你会采取的行动。');
    if (text.length > 1200) hints.push('回答较长，可以保留核心结论、两到三条依据和一个例子，练习在建议时间内说完。');
    if (!/首先|其次|最后|第一|第二|第三|一是|二是|1[.、．）)]|一[、）)]/.test(text)) {
      hints.push('可以用“结论—依据—行动”组织回答，让听者容易跟上你的思路。');
    }
    if (!/例如|比如|举例|案例|项目|实习|课程|当时|有一次/.test(text)) {
      hints.push('可以加入课程项目、实习或生活中的一个例子，说明自己的具体做法。');
    }
    if (!hints.length) hints.push('可以口头复述一次，检查结论是否靠前、例子是否具体，并观察作答用时。');
    return hints.slice(0, 3);
  }

  return { buildSession, summarize, validateSession, exportReport, answerHints };
});

    if (!s) { view = 'history'; return historyView(); }
    const summary = engine.summarize(s, questions);
    const totalSeconds = Object.values(s.answers).reduce((sum, a) => sum + a.seconds, 0);
    return `<div class="page-head"><div><div class="eyebrow">REFLECT. REFINE. REPEAT.</div><h1 class="page-title">你的面试复盘</h1><p class="page-subtitle">${esc(roleName(s.role))} · ${s.mode === 'practice' ? '边练边复盘' : '完整模拟面试'} · ${date(s.finishedAt)}</p></div><button class="button secondary" data-action="export-report">${icon('download', 16)}导出复盘</button></div>
      <div class="report-intro"><div><h2>又练了一次，也更靠近一步。</h2><p>${summary.reviewed < summary.answered ? `已完成 ${summary.answered} 道回答。点击下方“逐题复盘”，对照思路完成自评。` : '把还没讲清楚的地方，变成下一次练习的重点。'}</p></div><div class="seal">${icon('check', 30)}</div></div>
      <div class="stats"><div class="panel stat"><span>已回答 / 总题量</span><strong>${summary.answered}<small> / ${summary.total}</small></strong></div><div class="panel stat"><span>累计作答用时</span><strong>${clock(totalSeconds)}</strong></div><div class="panel stat"><span>已完成自评</span><strong>${summary.reviewed}<small> 题</small></strong></div><div class="panel stat"><span>自评要点覆盖率</span><strong>${summary.coverage === null ? '—' : `${summary.coverage}<small>%</small>`}</strong></div></div>
      <div class="report-grid"><section class="panel report-panel"><h3>各类题目，自评掌握情况</h3><p class="small-text muted">仅统计已自评回答；跳过和未自评题目不计入比例。</p>${summary.categories.map(c => `<div class="category-row"><div class="label"><span>${esc(c.name)}</span><span class="muted">${c.total ? `${c.mastered} / ${c.total} 个要点` : '尚未自评'}</span></div><div class="progress-track"><i style="width:${c.total ? c.mastered / c.total * 100 : 0}%"></i></div></div>`).join('')}</section>
      <section class="panel report-panel"><h3>下一次，重点练这些</h3>${summary.weakPoints.length ? summary.weakPoints.slice(0, 4).map(p => `<div class="weak-item"><strong>${esc(p.label)}</strong><span>${esc(p.detail)}</span></div>`).join('') : `<div class="soft-note">${summary.reviewed ? '已自评的要点都已勾选。试着脱离参考思路，再用 2 分钟完整说一次。' : '完成逐题自评后，这里会整理你尚未勾选的回答要点。'}</div>`}${summary.skipped ? `<p class="small-text muted">另有 ${summary.skipped} 道跳过题，建议优先重练。</p>` : ''}</section></div>
      <div class="section-heading"><h2>逐题复盘</h2><small>保留自己的回答，回看每一次思考</small></div><div class="review-list">${s.questionIds.map((id, i) => { const q = byId.get(id); const a = answerFor(s, id); return `<article class="panel review-row"><span class="number">${String(i + 1).padStart(2, '0')}</span><div><h3>${esc(q.title)}</h3><small>${esc(q.category)} · ${a.skipped ? '已跳过' : a.reviewed ? `自评 ${a.checked.filter(Boolean).length}/${q.points.length} 个要点` : '待自评'} · ${clock(a.seconds)}</small></div><button class="button secondary small" data-action="review-question" data-id="${id}">${a.reviewed || a.skipped ? '查看复盘' : '开始自评'}</button></article>`; }).join('')}</div>
      <div class="action-row"><button class="button secondary" data-action="navigate" data-view="home">${icon('back', 16)}返回练习首页</button><button class="button" data-action="practice-again">再练一场 ${icon('refresh', 16)}</button></div>`;
  }
  function libraryView(favorites = false) {
    const filtered = questions.filter(q => (!favorites || state.favorites.includes(q.id)) && (library.role === 'all' || q.roles.includes('all') || q.roles.includes(library.role)) && (library.stage === 'all' || q.stage === library.stage) && `${q.title} ${q.prompt} ${q.category}`.toLowerCase().includes(library.search.toLowerCase().trim()));
    return `<div class="page-head"><div><div class="eyebrow">BUILD YOUR FINANCE TOOLKIT</div><h1 class="page-title">${favorites ? '留给下一次练习的题。' : '把常见问题，练成拿手题。'}</h1><p class="page-subtitle">${favorites ? '收藏值得再练的题目，慢慢补齐自己的准备清单。' : `${questions.length} 道题 · 每题附参考思路、追问和易错点。`}</p></div></div>
      <div class="filters"><label class="search-label"><span class="visually-hidden">搜索面试题</span><input id="search-input" type="search" placeholder="搜索题目，例如：现金流、Excel、自我介绍" value="${esc(library.search)}"></label><label><span class="visually-hidden">按岗位筛选</span><select id="filter-role"><option value="all">全部岗位</option>${roles.map(r => `<option value="${r.id}" ${library.role === r.id ? 'selected' : ''}>${esc(r.name)}</option>`).join('')}</select></label><label><span class="visually-hidden">按题型筛选</span><select id="filter-stage"><option value="all">全部题型</option>${Object.entries(stageNames).map(([id, label]) => `<option value="${id}" ${library.stage === id ? 'selected' : ''}>${label}</option>`).join('')}</select></label></div>
      <div class="section-heading"><h2>共 ${filtered.length} 道题目</h2><small>按岗位与题型自由筛选</small></div>${filtered.length ? `<div class="library-grid">${filtered.map(q => `<article class="panel library-card"><div class="question-meta" style="margin:0"><span class="badge">${esc(q.category)}</span><span class="badge orange">${esc(q.difficulty)}</span></div><h3>${esc(q.title)}</h3><p>${esc(q.prompt)}</p><div class="action-row"><button class="link-button" data-action="favorite" data-id="${q.id}" aria-pressed="${state.favorites.includes(q.id)}">${icon('star', 15)}${state.favorites.includes(q.id) ? '已收藏' : '收藏'}</button><div class="action-group"><button class="link-button" data-action="preview-question" data-id="${q.id}">查看思路</button><button class="button secondary small" data-action="practice-one" data-id="${q.id}">练这一题 ${icon('arrow', 13)}</button></div></div></article>`).join('')}</div>` : `<section class="panel empty">${icon(favorites ? 'star' : 'book', 35)}<h3>${favorites && !state.favorites.length ? '你的收藏夹，还在等待第一道题。' : '暂时没有匹配的题目。'}</h3><p>${favorites && !state.favorites.length ? '在题库或练习中点击“收藏”，就能在这里找到它。' : '试试其他关键词，或者切换到全部岗位。'}</p><button class="button secondary" data-action="${favorites && !state.favorites.length ? 'navigate' : 'reset-filters'}" data-view="library">${favorites && !state.favorites.length ? '去题库看看' : '清除筛选'}</button></section>`}`;
  }
  function historyView() {
    return `<div class="page-head"><div><div class="eyebrow">EVERY PRACTICE COUNTS</div><h1 class="page-title">把进步，留在这里。</h1><p class="page-subtitle">保留最近 30 场已完成面试 · ${accounts ? '云端保存成功后，可在其他设备登录查看' : '浏览器更换或清理数据后不会同步'}</p></div>${state.history.length ? `<button class="link-button" data-action="clear-history">${icon('trash', 15)}清空记录</button>` : ''}</div>
      ${state.history.length ? state.history.map(s => { const summary = engine.summarize(s, questions); return `<article class="panel history-row"><span class="role-icon" style="margin:0">${icon(roleIcons[s.role], 22)}</span><div class="history-info"><h3>${esc(roleName(s.role))} <span class="badge">${s.mode === 'practice' ? '练习' : '模拟'}</span></h3><small>${date(s.finishedAt)} · ${summary.answered}/${summary.total} 题已回答 · ${summary.reviewed} 题已自评</small></div><button class="button secondary small" data-action="open-report" data-id="${s.id}">查看复盘 ${icon('arrow', 14)}</button></article>`; }).join('') : `<section class="panel empty">${icon('clock', 38)}<h3>第一场练习，从今天开始。</h3><p>完成一场面试后，回答和复盘会自动保存在这里。</p><button class="button" data-action="navigate" data-view="home">开始第一场练习 ${icon('arrow', 16)}</button></section>`}`;
  }
  function render({ keepScroll = false, focusSearch = false } = {}) {
    const scroll = window.scrollY;
    const focused = document.activeElement;
    const focusId = focused?.id;
    const focusData = focused?.dataset ? { ...focused.dataset } : {};
    const selectionStart = focusSearch ? focused?.selectionStart : null;
    const selectionEnd = focusSearch ? focused?.selectionEnd : null;
    const content = view === 'home' ? homeView() : view === 'interview' ? interviewView() : view === 'report' ? reportView() : view === 'library' || view === 'favorites' ? libraryView(view === 'favorites') : historyView();
    app.innerHTML = shell(content);
    if (keepScroll) window.scrollTo(0, scroll); else window.scrollTo(0, 0);
    if (focusSearch) {
      const field = document.getElementById('search-input');
      field.focus({ preventScroll: true });
      field.setSelectionRange(selectionStart, selectionEnd);
    } else if (keepScroll) {
      const replacement = (focusId && document.getElementById(focusId)) || [...app.querySelectorAll('[data-action]')].find(el => focusData.action && Object.entries(focusData).every(([key, value]) => el.dataset[key] === value));
      replacement?.focus({ preventScroll: true });
    } else {
      const heading = app.querySelector('.question-title') || app.querySelector('h1');
      if (heading) { heading.tabIndex = -1; heading.focus({ preventScroll: true }); }
    }
  }
  function navigate(next) {
    saveDraft(); stopSpeech(); persist(); view = next; paused = false; render();
  }
  function stopSpeech() { if ('speechSynthesis' in window) window.speechSynthesis.cancel(); }
  function speak(qid) {
    if (!('speechSynthesis' in window)) { toast('当前浏览器不支持朗读，可以直接阅读题目。'); return; }
    if (window.speechSynthesis.speaking) { stopSpeech(); return; }
    const q = byId.get(qid);
    const utterance = new SpeechSynthesisUtterance(`${q.title}。${q.prompt}`);
    utterance.lang = 'zh-CN'; utterance.rate = 0.92;
    const voice = window.speechSynthesis.getVoices().find(v => v.lang.startsWith('zh'));
    if (voice) utterance.voice = voice;
    utterance.onerror = event => { if (!['interrupted', 'canceled'].includes(event.error)) toast('此设备暂时无法朗读，可以继续文字作答。'); };
    window.speechSynthesis.speak(utterance);
  }
  function downloadReport() {
    const s = reportSession();
    if (!s) return;
    const text = engine.exportReport(s, questions, roles);
    const url = URL.createObjectURL(new Blob(['\ufeff' + text], { type: 'text/plain;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = `财务面试复盘-${roleName(s.role)}-${s.finishedAt.slice(0, 10)}.md`; a.click();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    toast('复盘已导出，包含你的回答与参考思路。');
  }
  function showModal(html, data = {}) {
    modalReturnFocus = document.activeElement;
    modal = data;
    const backdrop = document.createElement('div'); backdrop.className = 'modal-backdrop'; backdrop.id = 'modal-backdrop';
    backdrop.innerHTML = `<section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">${html}</section>`;
    document.body.append(backdrop);
    document.body.style.overflow = 'hidden';
    backdrop.querySelector('button, input, summary')?.focus();
  }
  function closeModal() {
    document.getElementById('modal-backdrop')?.remove(); modal = null; document.body.style.overflow = ''; timerStamp = Date.now();
    if (modalReturnFocus?.isConnected) modalReturnFocus.focus();
  }
  function confirmDialog(title, description, label, action) {
    showModal(`<div class="modal-head"><h2 id="modal-title">${esc(title)}</h2><button class="icon-button" aria-label="关闭" data-action="close-modal">${icon('close')}</button></div><p class="small-text muted">${esc(description)}</p><div class="action-row"><button class="button secondary" data-action="close-modal">取消</button><button class="button" data-action="confirm">${esc(label)}</button></div>`, { confirm: action });
  }
  function previewQuestion(qid) {
    const q = byId.get(qid);
    showModal(`<div class="modal-head"><div><span class="badge">${esc(q.category)}</span><h2 id="modal-title">${esc(q.title)}</h2></div><button class="icon-button" aria-label="关闭" data-action="close-modal">${icon('close')}</button></div><p class="question-prompt">${esc(q.prompt)}</p><div class="review-section"><h3>回答要点</h3>${q.points.map(p => `<p class="sample"><strong>${esc(p.label)}</strong><br>${esc(p.detail)}</p>`).join('')}</div><div class="review-section"><h3>参考思路</h3><p class="sample">${esc(q.sample)}</p><div class="pitfall">容易忽略：${esc(q.pitfall)}</div></div><div class="review-section"><h3>面试官可能追问</h3><p class="sample">${esc(q.followUp)}</p></div><div class="action-row"><button class="button secondary" data-action="close-modal">关闭</button><button class="button" data-action="modal-practice" data-id="${q.id}">练这一题 ${icon('arrow', 16)}</button></div>`, { qid });
  }
  function reviewQuestion(qid) {
    const s = reportSession();
    const q = byId.get(qid); const a = answerFor(s, qid);
    showModal(`<div class="modal-head"><div><span class="badge">逐题复盘</span><h2 id="modal-title">${esc(q.title)}</h2></div><button class="icon-button" aria-label="关闭" data-action="close-modal">${icon('close')}</button></div><p class="sample">${esc(q.prompt)}</p><h3 class="small-text">你的回答</h3><div class="own-answer">${esc(a.text) || '本题已跳过。'}</div>${reviewBody(q, a, 'report')}<div class="action-row"><button class="button secondary" data-action="modal-practice" data-id="${qid}">重新练习此题</button><button class="button" data-action="save-review" data-id="${qid}">${a.skipped ? '完成查看' : '保存自评'} ${icon('check', 16)}</button></div>`, { qid, checks: [...a.checked], report: true });
  }

  document.addEventListener('click', event => {
    const button = event.target.closest('[data-action]');
    if (!button || button.disabled || button.type === 'checkbox') return;
    event.preventDefault();
    if (syncFromStorage()) { toast('另一个页面更新了练习，已同步最新进度。请继续操作。'); return; }
    const { action, id } = button.dataset;
    if (action === 'navigate') navigate(button.dataset.view);
    else if (action === 'select-role') { state.settings.role = button.dataset.role; persist(); render({ keepScroll: true }); }
    else if (action === 'select-mode') { state.settings.mode = button.dataset.mode; persist(); render({ keepScroll: true }); }
    else if (action === 'select-count') { state.settings.count = Number(button.dataset.count); persist(); render({ keepScroll: true }); }
    else if (action === 'start') startSession();
    else if (action === 'resume') { view = 'interview'; paused = false; timerStamp = Date.now(); render(); }
    else if (action === 'save-exit') { navigate('home'); accounts?.flush(); toast(accounts ? '草稿已保留，云端同步状态见页面顶部。' : '已保存，下次可以接着练。'); }
    else if (action === 'pause') { saveDraft(); tick(); paused = !paused; timerStamp = Date.now(); persist(); render({ keepScroll: true }); }
    else if (action === 'submit-answer') submitAnswer();
    else if (action === 'skip') { saveDraft(); const a = answerFor(state.active, state.active.questionIds[state.active.current]); if (a.text.trim()) confirmDialog('跳过这一题？', '已写的草稿会保留，但本题将标记为跳过，不计入已回答题数。', '跳过此题', () => submitAnswer(true)); else submitAnswer(true); }
    else if (action === 'next') advance();
    else if (action === 'retry-current') { const s = state.active; const a = answerFor(s, s.questionIds[s.current]); a.reviewed = false; a.skipped = false; a.checked.fill(false); s.phase = 'answer'; paused = false; timerStamp = Date.now(); persist(); render(); }
    else if (action === 'favorite') { saveDraft(); state.favorites = state.favorites.includes(id) ? state.favorites.filter(q => q !== id) : [...state.favorites, id]; persist(); render({ keepScroll: true }); toast(state.favorites.includes(id) ? '已加入收藏，留给下一次练习。' : '已取消收藏。'); }
    else if (action === 'speak') speak(id);
    else if (action === 'open-report') { reportId = id; view = 'report'; render(); }
    else if (action === 'export-report') downloadReport();
    else if (action === 'practice-again') { const s = reportSession(); state.settings.role = s.role; state.settings.mode = s.mode; startSession(); }
    else if (action === 'practice-one') startSession([id]);
    else if (action === 'preview-question') previewQuestion(id);
    else if (action === 'review-question') reviewQuestion(id);
    else if (action === 'close-modal') closeModal();
    else if (action === 'confirm') { const callback = modal.confirm; closeModal(); callback(); }
    else if (action === 'modal-practice') { closeModal(); startSession([id]); }
    else if (action === 'save-review') { const a = answerFor(reportSession(), id); if (!a.skipped) { a.checked = [...modal.checks]; a.reviewed = true; } closeModal(); persist(); accounts?.flush(); render({ keepScroll: true }); toast(accounts ? '复盘已保留，正在同步到云端。' : '复盘已保存。'); }
    else if (action === 'reset-filters') { library = { search: '', role: 'all', stage: 'all' }; render(); }
    else if (action === 'clear-history') confirmDialog('清空所有已完成的练习记录？', accounts ? '此操作会同步清除该账号的历史面试。需要保留的回答，请先打开对应复盘并导出。' : '此操作只清除本浏览器的历史面试。需要保留的回答，请先打开对应复盘并导出。', '清空记录', () => { state.history = []; persist(); accounts?.flush(); render(); toast('练习记录已清空。'); });
  });
  document.addEventListener('input', event => {
    if (syncFromStorage()) { toast('已同步另一页面的最新进度，请继续作答。'); return; }
    if (event.target.id === 'answer-input') { saveDraft(); persist(); document.getElementById('char-count').textContent = event.target.value.length; }
    else if (event.target.id === 'search-input' && !event.isComposing) { library.search = event.target.value; render({ keepScroll: true, focusSearch: true }); }
  });
  document.addEventListener('compositionend', event => { if (event.target.id === 'search-input') { library.search = event.target.value; render({ keepScroll: true, focusSearch: true }); } });
  document.addEventListener('change', event => {
    if (syncFromStorage()) return;
    if (event.target.id === 'filter-role') { library.role = event.target.value; render({ keepScroll: true }); }
    else if (event.target.id === 'filter-stage') { library.stage = event.target.value; render({ keepScroll: true }); }
    else if (event.target.dataset.action === 'check-point') {
      const { source, id, index } = event.target.dataset;
      if (source === 'active') { const answer = answerFor(state.active, id); answer.checked[Number(index)] = event.target.checked; persist(); }
      else if (modal?.report) modal.checks[Number(index)] = event.target.checked;
    }
  });
  document.addEventListener('keydown', event => {
    if (event.key === 'Escape') { stopSpeech(); if (modal) closeModal(); }
    if (event.key === 'Tab' && modal) {
      const nodes = [...document.querySelectorAll('#modal-backdrop button, #modal-backdrop input:not(:disabled), #modal-backdrop summary')];
      const first = nodes[0]; const last = nodes[nodes.length - 1];
      if (event.shiftKey && document.activeElement === first) { event.preventDefault(); last.focus(); }
      else if (!event.shiftKey && document.activeElement === last) { event.preventDefault(); first.focus(); }
    }
  });
  if (accounts) accounts.start({
    defaultState: () => readState(null),
    capture: () => { saveDraft(); persist(); },
    onLock: () => { stopSpeech(); if (modal) closeModal(); state = readState(null); view = 'home'; paused = true; app.replaceChildren(); },
    onState: next => { stopSpeech(); if (modal) closeModal(); state = readState(JSON.stringify(next)); view = 'home'; reportId = null; paused = false; timerStamp = Date.now(); render(); }
  });
  else render();
})();

</script>
</body>
</html>
